name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Unit and service tests
        run: python -m unittest discover -s tests -v

      - name: Lint Python
        run: ruff check .

      - name: Compile Python
        run: python -m compileall -q honeypot_common categories tests

      - name: Validate Compose files
        run: |
          for file in categories/*/docker-compose.yml; do
            docker compose -f "$file" config --quiet
          done

      - name: Validate shell scripts
        run: bash -n categories/credential-honey/deploy.sh
