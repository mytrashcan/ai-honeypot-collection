name: ai-honeypot-token-drain

services:
  token-drain-maze:
    build:
      context: ../..
      dockerfile: categories/token-drain-maze/Dockerfile
    image: ai-honeypot/token-drain-maze:local
    init: true
    user: "10001:10001"
    read_only: true
    ports:
      - "127.0.0.1:${HONEYPOT_PORT:-8081}:8080"
    environment:
      HONEYPOT_LOG_PATH: /data/events.jsonl
      MAZE_MAX_DEPTH: "${MAZE_MAX_DEPTH:-20}"
      MAZE_TARPIT_MIN_MS: "${MAZE_TARPIT_MIN_MS:-500}"
      MAZE_TARPIT_MAX_MS: "${MAZE_TARPIT_MAX_MS:-3000}"
    volumes:
      - events:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  events:
