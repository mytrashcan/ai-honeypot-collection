name: ai-honeypot-feed

services:
  feed-webhook-trap:
    build:
      context: ../..
      dockerfile: categories/feed-webhook-trap/Dockerfile
    image: ai-honeypot/feed-webhook-trap:local
    init: true
    user: "10001:10001"
    read_only: true
    ports:
      - "127.0.0.1:${HONEYPOT_PORT:-8100}:8099"
    environment:
      HONEYPOT_LOG_PATH: /data/events.jsonl
    volumes:
      - events:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/healthz', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  events:
