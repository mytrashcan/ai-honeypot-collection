name: ai-honeypot-collection

x-service-defaults: &service-defaults
  init: true
  user: "10001:10001"
  read_only: true
  restart: unless-stopped
  networks:
    - honeypot
  volumes:
    - logs:/data
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 100
  mem_limit: 256m
  stop_grace_period: 15s
  healthcheck: &http-healthcheck
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"
    interval: 30s
    timeout: 3s
    retries: 3
    start_period: 10s

services:
  web-scanner-trap:
    <<: *service-defaults
    build:
      context: .
      dockerfile: categories/web-scanner-trap/Dockerfile
    image: ai-honeypot/web-scanner-trap:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HONEYPOT_LOG_PATH: /data/web-scanner-trap.jsonl

  credential-honey:
